# 이 저장소는 더 이상 배포하지 않습니다.
#
# 봇 코드는 `AX-Lions/backend` 의 `bot/` 으로 옮겼습니다. 제출할 수 있는 저장소가
# 셋이 아니라 둘이라 합쳤고, 커밋 이력은 작성자·날짜 그대로 옮겨 갔습니다
# (`git log -- bot/`).
#
# **이 저장소는 지우지 않습니다.** PR 17건과 이슈 11건은 옮겨지지 않는데, 리뷰
# 코멘트가 협업 기록으로는 커밋보다 강합니다. 읽기용으로 남깁니다.
#
# 워크플로를 파일째 지우지 않고 비워 두는 이유 — 지우면 "배포가 원래 없었다" 로
# 읽힙니다. 여기 있었고 어디로 갔는지가 남아야 합니다.
name: 배포 (중단됨 — backend/bot 으로 이전)

on:
  workflow_dispatch:

jobs:
  moved:
    runs-on: ubuntu-latest
    steps:
      - name: 이전 안내
        run: |
          echo "::notice::봇 배포는 AX-Lions/backend 의 deploy-bot.yml 로 옮겼습니다."
          echo "코드: https://github.com/AX-Lions/backend/tree/main/bot"
          exit 1
